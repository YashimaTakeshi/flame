<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <script>
      /*
       * 公開し直すと、古い名前の部品（JS・CSS）は消える。
       * ブラウザが**古い index.html** を持ったままだと部品が 404 になり、
       * 題だけ出て真っ黒な画面になる（実機で発生。GitHub Pages は HTML を 10 分持つ）。
       * 部品の取りこぼしに気づいたら、一度だけ取り直す（問い合わせを付けてキャッシュを外す）。
       * ここは束ねる前に動く必要があるので、素の JS で、部品より先に置く。
       */
      (function () {
        var KEY = 'fuchidori:stale-reload';
        var tried = false;
        function mounted() {
          var r = document.getElementById('root');
          return !!r && r.childElementCount > 0;
        }
        function recover() {
          if (tried || mounted()) return;
          tried = true;
          try {
            // 2度は繰り返さない（本当に壊れているときに往復し続けないため）
            if (sessionStorage.getItem(KEY)) return;
            sessionStorage.setItem(KEY, '1');
          } catch (e) {
            return;
          }
          location.replace(location.pathname + '?v=' + Date.now());
        }
        addEventListener(
          'error',
          function (e) {
            var t = e.target;
            if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) recover();
          },
          true,
        );
        addEventListener('load', function () {
          setTimeout(function () {
            if (!mounted()) {
              recover();
              return;
            }
            try {
              sessionStorage.removeItem(KEY);
            } catch (e) {}
            // 取り直しの印を人に見せない
            if (/[?&]v=\d+/.test(location.search)) history.replaceState(null, '', location.pathname);
          }, 2500);
        });
      })();
    </script>
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0F0F0F" />
    <title>Fuchidori</title>
    <meta name="description" content="写真に撮影情報のフチを付けます。開くだけで使えます。" />
    <!-- 人に渡した URL がそのまま案内になるよう、名前と印を添える -->
    <meta property="og:title" content="Fuchidori" />
    <meta property="og:description" content="写真に撮影情報のフチを付けます。開くだけで使えます。" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="icons/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
    <!-- iOS は透過を黒く落とすので、ホーム画面用は不透過の版を渡す -->
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Fuchidori" />
    <link rel="manifest" href="manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
